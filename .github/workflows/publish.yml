name: Publish IIIF site

# Builds the IIIF service from originals/ and publishes it to GitHub Pages.
# Enable it once under Settings -> Pages -> Build and deployment -> GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up uv
        uses: astral-sh/setup-uv
        with:
          enable-cache: true

      # Tiling is the slow part, so keep derivatives between runs. Images whose
      # bytes have not changed are reused; everything else is regenerated.
      - name: Restore image derivatives
        uses: actions/cache@v6
        with:
          path: |
            _site/iiif/images
            .iiif-cache
          key: iiif-derivatives-${{ hashFiles('originals/**', 'config.yml', 'src/iiif_pages/**') }}
          restore-keys: |
            iiif-derivatives-

      # The base URL comes from your Pages settings, so custom domains and
      # user/organisation sites get the right identifiers automatically.
      - name: Build the IIIF site
        run: uv run iiif-build --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
